<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"> 
  <title>WordPress Contributor Toolkit</title>
  <style>
    :root { color: #000; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      margin: 0;
    }
    button { margin-right: 8px; }
    .row { margin-bottom: 12px; }
    #sites { margin-top: 16px; }
    .site { border: 1px solid #ddd; padding: 8px; margin-bottom: 8px; border-radius: 6px; }
    .path { font-family: Menlo, monospace; font-size: 12px; color: #333; word-break: break-all; }
    #log { white-space: pre-wrap; background: #111; color: #eee; padding: 12px; border-radius: 6px; height: 220px; overflow: auto; }
    .patch-modal-header .components-modal__header-heading { color: #1e1e1e !important; }
    /*
      The patch screen's two columns (#186): the diff takes the room and where
      it can go stands beside it.

      A media query rather than flex-wrap, which was tried first and cannot do
      this. Wrapping keeps both columns on one flex line whose height is fixed
      by the modal, so the wrapped sidebar had nowhere to go and the diff
      overlapped it. Stacking has to change what scrolls as well as what sits
      where: side by side the sidebar scrolls alone and the diff stays put;
      stacked, the pair scrolls as one and the diff keeps a floor so it cannot
      collapse to a sliver above the destinations.

      The breakpoint is where a 300px sidebar starts squeezing the code rather
      than sitting next to it, which is what the screen is for.
    */
    .patch-columns { display: flex; gap: 16px; flex: 1; min-height: 0; align-items: stretch; }
    .patch-columns > .patch-diff { flex: 2 1 460px; min-width: 0; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
    .patch-columns > .patch-destinations { flex: 1 1 340px; min-width: 300px; max-width: 460px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
    @media (max-width: 900px) {
      .patch-columns { flex-direction: column; overflow-y: auto; }
      /*
        A definite height, not a minimum: the diff pane fills its column with
        `height: 100%`, and a percentage against a parent whose own height is
        content-derived resolves to nothing — the pane then grew past the
        column and sat on top of the destinations below it.
      */
      .patch-columns > .patch-diff { flex: none; height: 340px; }
      .patch-columns > .patch-destinations { flex: none; max-width: none; overflow-y: visible; }
    }
    .components-dropdown-menu__toggle { display: flex; flex-direction: row-reverse; gap: 4px; }
    /*
      The cue that points a contributor at the next thing to do (#252). The
      render puts `.next-action-cue` on exactly one block — whichever the
      resolver named — and the cue hook scrolls it into view. A soft amber glow
      marks it: subtle, no motion, and it sits over the block's own background
      rather than replacing it, so a coloured banner (the red "update
      incomplete", say) keeps its meaning. The block's own status text names the
      step, so the glow carries no label. No animation, so nothing here needs a
      reduced-motion guard; the only movement is the scroll, gated in the hook.

      `border-radius` here only rounds the glow around the wrapped action
      buttons, which set none of their own. The blocks set their radius inline,
      which the glow follows and this does not override.

      It reads --wpct-radius-control so the glow keeps the shape of the button
      inside it. It was a hand-picked 10px, which was already larger than
      anything @wordpress/components draws; once the dev-server button lost its
      own oversized radius, a 10px glow around a 2px button read as a rounded
      box floating behind a square one.
    */
    .next-action-cue {
      border-radius: var(--wpct-radius-control);
      box-shadow: 0 0 0 3px rgba(var(--wpct-cue), 0.45), 0 0 14px 3px rgba(var(--wpct-cue), 0.30);
    }
    /* Visually hidden but read aloud — the spoken half of the next-action cue
       (#252), for the live region that names the next step. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    /*
      The confirmation toasts (#253). SnackbarList ships
      `position: absolute; width: 100%` so it can anchor inside a sized editor
      region; ours lives in a fixed, shrink-to-fit corner wrapper, where that
      absolute list collapses to zero width and the toast never shows. Letting
      it flow normally hands positioning back to the wrapper: the stack sits at
      the wrapper's bottom-left and the newest notice lands nearest the corner.
    */
    .toolkit-snackbars.components-snackbar-list { position: static; width: auto; }
    /* Right anchor: keep each toast flush to the right so a shorter one does not
       drift left of a taller stack. */
    .toolkit-snackbars .components-snackbar-list__notice-container { display: flex; justify-content: flex-end; }
    /*
      The default snackbar is a faint, translucent pill that is easy to miss —
      too quiet for a confirmation that has to register (#253). This gives it
      weight: a solid surface, a larger bolder line, a real shadow, and a
      status-coloured left edge with a matching icon so "it worked" reads at a
      glance and an error stands apart from a success.
    */
    .toolkit-snackbars .components-snackbar.toolkit-toast {
      background: #1e1e1e;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      font-size: 14px;
      font-weight: 500;
      padding: 14px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32), 0 2px 6px rgba(0, 0, 0, 0.24);
    }
    /* Give the status icon room and centre it — its default -8px offset tucks it
       behind the coloured edge we add below. */
    .toolkit-snackbars .toolkit-toast .components-snackbar__content-with-icon { padding-left: 30px; }
    .toolkit-snackbars .toolkit-toast .components-snackbar__icon { left: 0; top: 50%; transform: translateY(-50%); }
    .toolkit-snackbars .toolkit-toast--success { border-left: 5px solid #00a32a; }
    .toolkit-snackbars .toolkit-toast--success .components-snackbar__icon { color: #4ab866; }
    .toolkit-snackbars .toolkit-toast--error { border-left: 5px solid #f86368; }
    .toolkit-snackbars .toolkit-toast--error .components-snackbar__icon { color: #f86368; }
  </style>
  <link rel="stylesheet" href="index.css" />
  <script defer src="index.js"></script>
  <script>window.addEventListener('error', e => { console.error(e.error || e.message) })</script>
  <script>window.addEventListener('unhandledrejection', e => { console.error(e.reason) })</script>
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta http-equiv="Cross-Origin-Resource-Policy" content="same-site" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
  <meta http-equiv="Permissions-Policy" content="clipboard-read=(self), clipboard-write=(self)" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    `light`, not `light dark`: this window has no dark theme. Every surface in
    it is painted light by hand — white cards, #1e1e1e text — and
    @wordpress/components ships light styles only. Declaring support for both
    let the browser paint the parts it owns, the native form controls, to match
    the OS instead. On a machine in dark mode that produced charcoal inputs on
    white cards, with placeholder text at dark-on-dark contrast: unreadable,
    and the guidance this app puts in placeholders is exactly what a first-timer
    needs to read.

    This was a promise the app could not keep, so it stops making it. The day a
    real dark theme exists, this goes back to `light dark` along with it.
  -->
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>
  <div id="root"></div>
</body>
</html>
