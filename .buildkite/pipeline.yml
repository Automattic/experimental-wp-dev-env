# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json

---
steps:
  ########################################################
  # Windows build
  ########################################################
  - label: ":windows: Windows Build"
    agents: { queue: windows }
    plugins: [$CI_TOOLKIT, $NVM_PLUGIN]
    command: |
      $ErrorActionPreference = "Stop"

      function Invoke-NativeCommand {
        param (
          [Parameter(Mandatory = $true)]
          [string]$FilePath,
          [Parameter(ValueFromRemainingArguments = $true)]
          [string[]]$ArgumentList
        )

        & $FilePath @ArgumentList
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      echo "~~~ Setup code signing"
      .buildkite/commands/setup_windows_code_signing.ps1

      echo "~~~ Install dependencies"
      Invoke-NativeCommand bash .buildkite/commands/install_node_dependencies.sh

      echo "~~~ Build Windows artifact"
      Invoke-NativeCommand npm run dist:win

      echo "~~~ Verify Azure Trusted Signing signature"
      .buildkite/commands/verify_windows_signature.ps1
    artifact_paths:
      - dist\*.exe
    notify:
      - github_commit_status: { context: "Windows Build" }

  ########################################################
  # macOS build
  ########################################################
  - label: ":mac: macOS Build"
    agents: { queue: mac }
    env:
      IMAGE_ID: $IMAGE_ID
    plugins: [$CI_TOOLKIT, $NVM_PLUGIN]
    command: |
      set -eu

      source .buildkite/commands/setup_macos_code_signing.sh

      echo "~~~ Install dependencies"
      .buildkite/commands/install_node_dependencies.sh

      echo "~~~ Build macOS artifact"
      npm run dist

      echo "~~~ Verify macOS code signing"
      bundle exec fastlane verify_code_signing
    artifact_paths:
      - dist/*.dmg
      - dist/*.zip
    notify:
      - github_commit_status: { context: "macOS Build" }

  ########################################################
  # Linux build
  ########################################################
  - label: ":linux: Linux Build"
    agents: { queue: default }
    command: |
      set -eu

      echo "~~~ Verify build environment"
      cat /etc/os-release
      node --version
      gcc --version
      g++ --version

      echo "~~~ Install Node dependencies"
      npm ci --no-audit --no-progress --maxsockets 1

      echo "~~~ Build Linux artifact"
      npm run dist
    plugins:
      - $DOCKER_PLUGIN:
          image: "$NODE_DOCKER_IMAGE"
          always-pull: true
    artifact_paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.snap
    notify:
      - github_commit_status: { context: "Linux Build" }
